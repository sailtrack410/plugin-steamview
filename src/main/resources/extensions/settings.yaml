apiVersion: v1alpha1
kind: Setting
metadata:
  name: pluginsteamview-settings
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $el: div
          attrs:
            class: "text-sm"
            style: |
              margin-bottom: 1rem;
              margin-top: -0.5rem;
              padding: 0.75rem 1rem;
              background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
              border-radius: 0.5rem;
              border: 1px solid #bae6fd;
          children:
            - $el: div
              attrs:
                style: |
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  flex-wrap: wrap;
                  gap: 0.5rem;
              children:
                - $el: span
                  attrs:
                    style: "color: #0369a1;"
                  children: "💬 遇到问题？加入 QQ 群 766203360 获取帮助"
                - $el: div
                  attrs:
                    style: "display: flex; gap: 0.5rem;"
                  children:
                    - $el: a
                      attrs:
                        href: "https://qm.qq.com/q/mPJeUOtG5G"
                        target: "_blank"
                        style: |
                          color: #fff;
                          background: #0ea5e9;
                          padding: 0.25rem 0.75rem;
                          border-radius: 0.25rem;
                          text-decoration: none;
                          font-size: 0.75rem;
                      children: "加入群聊"
                    - $el: button
                      attrs:
                        type: "button"
                        onclick: "navigator.clipboard.writeText('766203360').then(() => alert('已复制'))"
                        style: |
                          color: #0369a1;
                          background: #fff;
                          padding: 0.25rem 0.75rem;
                          border-radius: 0.25rem;
                          border: 1px solid #7dd3fc;
                          cursor: pointer;
                          font-size: 0.75rem;
                      children: "复制群号"
        - $formkit: text
          name: steamApiKey
          label: Steam API Key
          validation: required
          help: 在 https://steamcommunity.com/dev/apikey 获取 API Key
        - $formkit: text
          name: steamId
          label: Steam ID
          validation: required
          help: 17 位数字 ID，可在 Steam 主页 URL 中获取
        - $formkit: text
          name: proxyDomainApi
          label: API 域名
          value: api.steampowered.com
          help: 可填写你的反向代理域名，例如 steam-api.example.com
        - $formkit: text
          name: proxyDomainStore
          label: Store 域名
          value: store.steampowered.com
          help: 可填写你的反向代理域名，例如 steam-store.example.com
        - $formkit: text
          name: proxyDomainCommunity
          label: Community 域名
          value: steamcommunity.com
          help: 可填写你的反向代理域名
        - $formkit: select
          name: refreshInterval
          label: 数据刷新频率
          value: 24
          options:
            - label: 1 小时
              value: 1
            - label: 6 小时
              value: 6
            - label: 12 小时
              value: 12
            - label: 24 小时
              value: 24
          help: 到期后会自动重新拉取 Steam 数据
    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: list
          name: hiddenGames
          label: 默认隐藏游戏 App ID
          addLabel: 添加 App ID
          help: 这里的游戏将不会在前台页面展示
          itemType: string
          children:
            - $formkit: text
              index: $index
              validation: required
              placeholder: 例如 730
